name: Sync to Gitee

# 把仓库镜像到 Gitee（国内免梯可直接打开）。
#
# ── 为什么不再用 Yikun/hub-mirror-action（2026-09-16 重写）────────────────────
# 旧版靠 hub-mirror 镜像「整个 GitHub 账号」，而它必须先调 GitHub API 列出
# 账号下的仓库清单，这需要 src_token。该 secret 从未配置 → 请求走匿名 →
# 撞上 GitHub 匿名限流（60 次/小时，runner 共享出口 IP 几乎必然耗尽）→
# 日志里 `Total: 0, successed: 0`（一个仓库都没同步），但进程退出码仍是 0 →
# Actions 上显示绿色 ✓。属于「抽奖式 + 静默」的假成功：成功与失败都不可信。
#
# ── 新版思路：纯 git 直推，完全不碰 GitHub API 的仓库枚举 ────────────────────
#   * 本仓库：workflow 自带 checkout，代码已在 runner 本地，直接 push 到 Gitee
#   * 其他仓库：按下方 matrix 名单匿名 clone（公开库不需要凭证）再 push
#   * 只用已有 secret：GITEE_TOKEN（建仓/改设置）、GITEE_SSH_KEY（推送）
#     GitHub 侧只用 runner 自带的 GITHUB_TOKEN 读一个字段，不需要任何 PAT
#   * 可见性自动对齐 GitHub：读 GitHub 的 private 字段再写回 Gitee，
#     GitHub 上公开 → Gitee 上也公开，不靠人工同步。
#     注意必须分两阶段 —— Gitee 拒绝把「空仓库」设为公开
#     （PATCH 返回 422「空仓库不支持设置为公开仓库」），
#     所以顺序是「先建私有 → 推送内容 → 再改可见性」，
#     脚本因此拆成 ensure / align 两个子命令
#   * 任何一步失败都会让 job 真失败，不会再出现「绿色空转」
#
# ── 触发方式 ────────────────────────────────────────────────────────────────
#   * push 到 main/master → 只同步本仓库（秒级）
#   * 手动 Run workflow，勾选 include_all_repos → 并行同步 matrix 里的全部仓库
#   * 新增仓库需要追加到下方 matrix.repo 名单（这是本方案唯一的维护点）

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      include_all_repos:
        description: "同时镜像 matrix 名单里的其他公开仓库（会真的在 Gitee 建仓）"
        type: boolean
        default: false

permissions:
  contents: read

env:
  GH_OWNER: strangeyu911-tech
  GITEE_OWNER: strange_touchannel

jobs:
  mirror-self:
    name: 镜像本仓库
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（含全部历史与 refs）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确保 Gitee 仓库存在（推送前）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ensure-gitee-repo.sh ensure "${GH_OWNER}" "${GITEE_OWNER}" "${GITHUB_REPOSITORY##*/}"

      - name: 配置 Gitee SSH 私钥
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/gitee_key
          chmod 600 ~/.ssh/gitee_key
          echo "私钥已写入（$(wc -c < ~/.ssh/gitee_key) 字节）"

      - name: 推送 main 与 tag 到 Gitee
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/gitee_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY##*/}"
          git remote add gitee "git@gitee.com:${GITEE_OWNER}/${REPO}.git"
          git push --force gitee --all
          git push --force gitee --tags
          echo "✅ ${REPO} 已同步到 gitee.com/${GITEE_OWNER}/${REPO}"

      - name: 对齐可见性（推送后，空仓库不能设为公开）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ensure-gitee-repo.sh align "${GH_OWNER}" "${GITEE_OWNER}" "${GITHUB_REPOSITORY##*/}"

  mirror-all:
    name: 镜像 ${{ matrix.repo }}
    needs: mirror-self
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.include_all_repos == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # 一个仓库失败不影响其他仓库
      max-parallel: 2       # 别把 Gitee 的建仓接口打爆
      matrix:
        repo:
          - trendforge-v2
          - wx-assist
          - codex-auto-runner
          - Resume-Matcher
          - handoff-guard
          - aidy
          - Boy-Girl-friend-Copilot
          - AionsHome
          - culturelens
          - Boss-helper
          - TrendForge
          - LifeOS
          - InterPilot
    steps:
      - name: Checkout（取同步脚本）
        uses: actions/checkout@v4

      - name: 确保 Gitee 仓库存在（推送前）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ensure-gitee-repo.sh ensure "${GH_OWNER}" "${GITEE_OWNER}" "${{ matrix.repo }}"

      - name: 配置 Gitee SSH 私钥
        env:
          SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/gitee_key
          chmod 600 ~/.ssh/gitee_key

      - name: 裸克隆 GitHub 并推送到 Gitee
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/gitee_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          set -euo pipefail
          REPO="${{ matrix.repo }}"
          rm -rf "/tmp/${REPO}.git"
          # 公开库匿名克隆即可，不消耗 GitHub API 配额
          git clone --bare "https://github.com/${GH_OWNER}/${REPO}.git" "/tmp/${REPO}.git"
          git -C "/tmp/${REPO}.git" push --mirror "git@gitee.com:${GITEE_OWNER}/${REPO}.git"
          echo "✅ ${REPO} 已同步到 gitee.com/${GITEE_OWNER}/${REPO}"

      - name: 对齐可见性（推送后，空仓库不能设为公开）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ensure-gitee-repo.sh align "${GH_OWNER}" "${GITEE_OWNER}" "${{ matrix.repo }}"
